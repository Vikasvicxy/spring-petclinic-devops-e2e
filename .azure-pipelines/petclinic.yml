trigger:
- main

pool:
  name: Vikas-Pool

stages:


- stage: CI
  displayName: "CI"

  jobs:

  - job: Security
    displayName: "Gitleaks Scan"

    steps:

    - checkout: self

    - script: |
        gitleaks detect --source . --exit-code 1
      displayName: "Run Gitleaks"


  - job: Lint
    displayName: "Code Lint"

    dependsOn: Security

    steps:

    - checkout: self

    - script: |
        chmod +x mvnw
        ./mvnw spring-javaformat:validate
      displayName: "Run Lint"


  - job: Build
    displayName: "Maven Build and Test"

    dependsOn: Lint

    steps:

    - checkout: self

    - task: SonarQubePrepare@7
      displayName: "Prepare SonarQube"
      inputs:
        SonarQube: 'Pet-Clinic-SVC'
        scannerMode: 'Other'
        extraProperties: |
          sonar.projectKey=spring-petclinic-devops-e2e
          sonar.projectName=Spring PetClinic DevOps E2E

    - script: |
        chmod +x mvnw
        ./mvnw clean verify
      displayName: "Maven Build and Test"

    - task: SonarQubeAnalyze@7
      displayName: "SonarQube Analysis"

    - task: SonarQubePublish@7
      displayName: "Publish SonarQube Results"
      inputs:
        pollingTimeoutSec: '300'
