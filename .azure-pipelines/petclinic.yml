trigger:
- main

pool:
  name: 'Vikas-Pool'

stages:
- stage: CI
  displayName: "CI"
  jobs:
  - job: Security
    displayName: "Gitleaks Scan"
    steps:
    - checkout: self
    - script: |
        gitleaks detect --source . --exit-code 1
      displayName: "Run Gitleaks"

  - job: Lint
    displayName: "Code Lint"
    dependsOn: Security
    steps:
    - checkout: self
    - script: |
        chmod +x mvnw
        ./mvnw spring-javaformat:validate
      displayName: "Run Lint"

  - job: Build
    displayName: "Maven Build and SonarQube"
    dependsOn: Lint
    steps:
    - checkout: self
    - task: SonarQubePrepare@7
      displayName: "Prepare SonarQube"
      inputs:
        SonarQube: 'Pet-Clinic-SVC'
        scannerMode: 'Other'
        extraProperties: |
          sonar.projectKey=spring-petclinic-devops-e2e
          sonar.projectName=Spring PetClinic DevOps E2E
          sonar.branch.name=
          sonar.scanner.skipJreProvisioning=true

    - script: |
        chmod +x mvnw
        ./mvnw clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.branch.name=
      displayName: "Maven Build, Test and SonarQube"

    - task: SonarQubePublish@7
      displayName: "Publish SonarQube Results"
      inputs:
        pollingTimeoutSec: '300'

- stage: Docker
  displayName: "Build and Push Docker Image"
  dependsOn: CI
  jobs:
  - job: Docker
    displayName: "Build and Push to ACR"
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: "Build and Push Image using ACR Tasks"
      inputs:
        azureSubscription: 'Pet-Clinic-Azure'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr build \
            --registry petclinicvikasacr \
            --image spring-petclinic:$(Build.BuildId) \
            --image spring-petclinic:latest \
            .